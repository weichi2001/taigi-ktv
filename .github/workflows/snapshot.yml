name: drive-snapshot
on:
  schedule: [{cron: '17 * * * *'}]
  workflow_dispatch:
  push:
    paths: ['tools/snapshot.py']
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/snapshot.py
      - run: |
          git config user.name "snapshot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add drive-snapshot.json
          git diff --cached --quiet || (git commit -m "更新歌單快照" && git push)
